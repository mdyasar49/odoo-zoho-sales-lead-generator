name: Hourly Automated Odoo Sales Executive Scraper (CRM Ready)

on:
  schedule:
    # Runs automatically EVERY 1 HOUR at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 gspread google-auth

      - name: Run Live Odoo Sales Executive Scraper & Google Sheet Sync
        run: |
          python live_odoo_partner_tn_india_scraper.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      - name: Commit & Push Updated Documentation
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add -A
          git diff-index --quiet HEAD || git commit -m "auto: hourly scraper sync completed"
          git push
